# Free Supabase projects pause after a week with no activity. This asks the
# REST API for a table once a day, so Postgres itself has to answer.
#
# anon has no access to anything, so a healthy answer is Postgres refusing
# with permission denied (42501). A bad key is refused by the API gateway
# before Postgres runs, so it fails this check instead of looking healthy.
#
# Needs the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets.
# GitHub turns scheduled workflows off after 60 days with no commits; turn it
# back on from the Actions tab if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Postgres for a table through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi

          rm -f body.json
          status=$(curl --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --output body.json --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/app_settings?limit=1") || status=000

          echo "Supabase answered with HTTP $status."

          case "$status" in
            2??)
              exit 0
              ;;
          esac

          if grep -q '"code":"42501"' body.json 2>/dev/null; then
            echo "Postgres answered and refused anon, as it should."
            exit 0
          fi

          echo "::error::Postgres didn't answer (HTTP $status). Check the project isn't paused and the secrets are right."
          cat body.json 2>/dev/null || true
          exit 1
