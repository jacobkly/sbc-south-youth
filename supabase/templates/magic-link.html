<h2>Sign in to SBC South Youth Finances</h2>

<p>Enter this code to sign in:</p>

<p style="font-size: 28px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>

<p>Or open this link on the device you want to sign in on:</p>

<p><a href="{{ .RedirectTo }}/auth/callback?token_hash={{ .TokenHash }}&type=email">Sign in</a></p>

<p>The code and link expire in 1 hour. If you didn't try to sign in, you can ignore this email.</p>
